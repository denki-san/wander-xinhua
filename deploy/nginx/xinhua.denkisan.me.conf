server {
    listen 80;
    listen [::]:80;

    server_name xinhua.denkisan.me;
    root /var/www/xinhua-messenger;
    index index.html;

    access_log /var/log/nginx/xinhua.denkisan.me.access.log;
    error_log /var/log/nginx/xinhua.denkisan.me.error.log;

    location = /cdn/sha256/c4d557038677c9c48577636843fb784b496f4a92fc9ea6bbb1d5ca78e822c062/shanghai-cinema.glb.bin.js {
        alias /var/www/xinhua-cdn/sha256/c4d557038677c9c48577636843fb784b496f4a92fc9ea6bbb1d5ca78e822c062/shanghai-cinema.glb;
        types {
            model/gltf-binary js;
        }
        default_type model/gltf-binary;
        max_ranges 0;
        error_page 404 = @shanghai_cinema_asset_not_found;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Original-Name "shanghai-cinema.glb";
        add_header X-Content-SHA256 "c4d557038677c9c48577636843fb784b496f4a92fc9ea6bbb1d5ca78e822c062";
    }

    location @shanghai_cinema_asset_not_found {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /models/ {
        try_files $uri =404;
        expires 7d;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
