<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#69b9b5" />
    <meta
      name="description"
      content="进入按真实行政边界和道路比例重建的上海新华路手绘 3D 街区，自由闲逛，并发现唯一的一平米行动点。无需登录。"
    />
    <meta property="og:title" content="新华漫游志｜新华路 3D 闲逛" />
    <meta property="og:description" content="在按真实边界和道路比例重建的手绘 3D 新华路社区里随便走走。" />
    <meta property="og:type" content="website" />
    <title>新华漫游志｜新华路 3D 闲逛</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        // 仅在显式 QA 参数下，于应用模块执行前收集 console 与全局异常。
        const parameters = new URLSearchParams(window.location.search);
        if (parameters.get("qaRuntimeTelemetry") !== "1") return;
        const root = document.documentElement;
        const append = (key, values) => {
          const current = JSON.parse(root.dataset[key] || "[]");
          current.push(values.map((value) => String(value)).join(" ").slice(0, 600));
          root.dataset[key] = JSON.stringify(current.slice(-20));
        };
        root.dataset.runtimeQaTelemetry = "active";
        root.dataset.runtimeQaConsoleErrors = "[]";
        root.dataset.runtimeQaConsoleWarnings = "[]";
        root.dataset.runtimeQaWindowErrors = "[]";
        root.dataset.runtimeQaUnhandledRejections = "[]";
        const originalError = console.error.bind(console);
        const originalWarn = console.warn.bind(console);
        console.error = (...values) => {
          append("runtimeQaConsoleErrors", values);
          originalError(...values);
        };
        console.warn = (...values) => {
          append("runtimeQaConsoleWarnings", values);
          originalWarn(...values);
        };
        window.addEventListener("error", (event) => {
          append("runtimeQaWindowErrors", [
            event.message || event.error || "window-error",
          ]);
        });
        window.addEventListener("unhandledrejection", (event) => {
          append("runtimeQaUnhandledRejections", [
            event.reason || "unhandled-rejection",
          ]);
        });
      })();
    </script>
    <script type="module" src="/static-entry.tsx"></script>
  </body>
</html>
